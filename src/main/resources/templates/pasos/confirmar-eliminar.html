<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eliminar paso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h1 class="h4 mb-0">Eliminar paso</h1>
        </div>

        <div class="card-body">
            <p>¿Estás seguro de que quieres eliminar este paso?</p>

            <p>
                <strong>Receta:</strong>
                <span th:text="${paso.receta.nombre}"></span>
            </p>

            <p>
                <strong>Número de orden:</strong>
                <span th:text="${paso.numeroOrden}"></span>
            </p>

            <p>
                <strong>Descripción:</strong>
                <span th:text="${paso.descripcion}"></span>
            </p>

            <form th:action="@{/pasos/eliminar/{id}(id=${paso.id})}" method="post">
                <button type="submit" class="btn btn-danger">Confirmar eliminación</button>
                <a th:href="@{/pasos}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
