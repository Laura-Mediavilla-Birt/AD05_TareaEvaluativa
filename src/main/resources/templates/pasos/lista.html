<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pasos del recetario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="mb-4">Pasos de las recetas</h1>

    <div class="mb-3">
        <a th:href="@{/pasos/nuevo}" class="btn btn-primary">Añadir paso</a>
        <a th:href="@{/recetas}" class="btn btn-secondary">Volver a recetas</a>
    </div>

    <div th:if="${#lists.isEmpty(pasos)}" class="alert alert-info">
        Todavía no hay pasos guardados.
    </div>

    <table th:if="${!#lists.isEmpty(pasos)}" class="table table-striped table-bordered bg-white">
        <thead class="table-dark">
            <tr>
                <th>Receta</th>
                <th>Número de orden</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="paso : ${pasos}">
                <td th:text="${paso.receta.nombre}"></td>
                <td th:text="${paso.numeroOrden}"></td>
                <td th:text="${paso.descripcion}"></td>
                <td>
                    <a th:href="@{/pasos/editar/{id}(id=${paso.id})}"
                       class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/pasos/eliminar/{id}(id=${paso.id})}"
                       class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
