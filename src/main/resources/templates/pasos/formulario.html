<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de paso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="mb-4"
        th:text="${paso.id == null ? 'Añadir paso' : 'Editar paso'}">
        Formulario de paso
    </h1>

    <form th:action="@{/pasos/guardar}" th:object="${paso}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="recetaId" class="form-label">Receta</label>
            <select id="recetaId" name="recetaId" class="form-select" required>
                <option value="">Selecciona una receta</option>
                <option th:each="receta : ${recetas}"
                        th:value="${receta.id}"
                        th:text="${receta.nombre}"
                        th:selected="${recetaId != null and recetaId == receta.id}">
                </option>
            </select>
            <div class="text-danger"
                 th:if="${#fields.hasErrors('receta')}"
                 th:errors="*{receta}"></div>
        </div>

        <div class="mb-3">
            <label for="numeroOrden" class="form-label">Número de orden</label>
            <input type="number" id="numeroOrden" th:field="*{numeroOrden}"
                   class="form-control" min="1"
                   th:classappend="${#fields.hasErrors('numeroOrden')} ? ' is-invalid'">
            <div class="invalid-feedback" th:errors="*{numeroOrden}"></div>
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea id="descripcion" th:field="*{descripcion}"
                      class="form-control" rows="4"
                      th:classappend="${#fields.hasErrors('descripcion')} ? ' is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/pasos}" class="btn btn-secondary">Cancelar</a>

    </form>
</div>

</body>
</html>
