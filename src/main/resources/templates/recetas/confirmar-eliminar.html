<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eliminar receta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h1 class="h4 mb-0">Eliminar receta</h1>
        </div>

        <div class="card-body">
            <p>¿Estás seguro de que quieres eliminar esta receta?</p>

            <p>
                <strong>Nombre:</strong>
                <span th:text="${receta.nombre}"></span>
            </p>

            <p>
                <strong>Categoría:</strong>
                <span th:text="${receta.categoria}"></span>
            </p>

            <div class="alert alert-warning">
                También se eliminarán todos los pasos asociados a esta receta.
            </div>

            <form th:action="@{/recetas/eliminar/{id}(id=${receta.id})}" method="post">
                <button type="submit" class="btn btn-danger">Confirmar eliminación</button>
                <a th:href="@{/recetas}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
