<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de receta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="mb-4" th:text="${receta.id == null ? 'Añadir receta' : 'Editar receta'}">
        Formulario de receta
    </h1>

    <form th:action="@{/recetas/guardar}" th:object="${receta}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? ' is-invalid'">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea id="descripcion" th:field="*{descripcion}"
                      class="form-control" rows="4"
                      th:classappend="${#fields.hasErrors('descripcion')} ? ' is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
        </div>

        <div class="mb-3">
            <label for="categoria" class="form-label">Categoría</label>
            <input type="text" id="categoria" th:field="*{categoria}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('categoria')} ? ' is-invalid'">
            <div class="invalid-feedback" th:errors="*{categoria}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/recetas}" class="btn btn-secondary">Cancelar</a>

    </form>
</div>

</body>
</html>
