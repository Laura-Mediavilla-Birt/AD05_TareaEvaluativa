<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recetario - Recetas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="mb-4">Mi recetario</h1>

    <div class="mb-3">
        <a th:href="@{/recetas/nueva}" class="btn btn-primary">Añadir receta</a>
        <a th:href="@{/pasos}" class="btn btn-secondary">Ver pasos</a>
    </div>

    <div th:if="${#lists.isEmpty(recetas)}" class="alert alert-info">
        Todavía no hay recetas guardadas.
    </div>

    <table th:if="${!#lists.isEmpty(recetas)}" class="table table-striped table-bordered bg-white">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Categoría</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="receta : ${recetas}">
                <td th:text="${receta.nombre}"></td>
                <td th:text="${receta.descripcion}"></td>
                <td th:text="${receta.categoria}"></td>
                <td>
                    <a th:href="@{/recetas/editar/{id}(id=${receta.id})}"
                       class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/recetas/eliminar/{id}(id=${receta.id})}"
                       class="btn btn-danger btn-sm">Eliminar</a>
                    <a th:href="@{/pasos/nuevo}"
                       class="btn btn-success btn-sm">Añadir paso</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
